# 长对话记忆评测集（F22）。15 段 × 20 轮。
#
# ## 这份数据在测什么
#
# 每一段都是一次真实咨询的样子：**事实是一轮一轮挤出来的，不是一口气说完的**。
# 用户第 1 轮随口说了月薪，第 20 轮才问"那到底赔多少"——中间隔了 19 轮。
#
# ## 探针（probe）怎么设计
#
# `probes` 里每一项声明"在**第几轮**问"以及"提示词里**必须出现**哪些字符串"。
# 期望值写成 `槽位标签：值` 的片段（比如 `月工资：12000`），理由有两个：
#
# 1. **不会误命中。** 只写 `"12000"` 的话，任何别的地方出现这串数字都算通过；
#    而 `"月工资：12000"` 只可能来自槽位层。
# 2. **数据集自己会体检。** `memory_eval.py` 会在探针那一轮先跑一遍抽取，
#    确认"这个槽位此时**确实**是这个值"。对不上就当场报错——
#    **手写的评测集一定会写错，所以不靠自觉，靠检查。**
#
# ⚠️ 每段对话里的轮次文本**刻意不重复**那些数字。用户是来提问的，
# 不是来背自己工资的；只要不重复，"隔了多少轮"这一栏才有意义。
#
# ## 为什么探针大多在第 8 / 14 / 20 轮
#
# 生产配置的窗口是 6 轮。第 8 轮时第 1~2 轮已经出窗口，第 14 轮时第 8 轮出窗口……
# 这样"隔了多少轮"才有跨度，才能画出保持率曲线。
#
# ## 哪些探针是"对照组"
#
# 对照组的作用是**证明这套检测本身有效**——它必须满足"该过的过、该挂的挂"：
#
# - `s01_layoff` 第 8 轮、`s02_illegal` 第 8 轮这类（隔 6~7 轮）：
#   滑动窗口**应该能过**（窗口是 10 轮，还盖得住），
#   `no_memory`**应该挂**（它只带最后一轮）。
#   两者的差别出现了，说明这个指标真的在分辨策略，而不是"谁都是 0"。
#
# ⚠️ **一开始我在这里写的是错的**：原本把 `s01_layoff` 第 20 轮当成对照组，
# 理由是"那个事实是第 19 轮刚说的，隔 1 轮，所有策略都该过"。
# 跑出来才发现它挂了三个策略——因为那是 `工作年限（月）：37`，
# 而第 19 轮的原话是"我干了三年零一个月"，**原话里根本没有 37 这个数**。
# 它是算出来的。**隔得近不等于原文里有**，这两件事我一开始混成了一件。
# （这个分类现在是程序判的，见 `memory_eval.classify_quotable`。）

- id: s01_layoff
  title: 经济性裁员——最基础的一条路径
  turns:
    - "我2021年3月入职，月薪12000，公司现在说要裁员"
    - "公司在西安，做软件的，一千多人"
    - "裁员名单里有我，说下个月走"
    - "他们说是经营困难，整个部门都裁"
    - "劳动合同签的是三年"
    - "我平时加班挺多的"
    - "社保是一直交着的"
    - "那经济补偿是怎么算的"
    - "什么情况下不给补偿"
    - "我们部门裁了二十多个人，这算大规模裁员吗"
    - "没让我提前一个月走，直接通知下周办手续"
    - "除了补偿金还有别的吗"
    - "年假没休完能折算吗"
    - "我之前在公司干过一段，中间离职又回来的，工龄怎么算"
    - "离职证明上写什么会有影响吗"
    - "社保断缴对我有影响吗"
    - "年终奖还没发，能要吗"
    - "我这情况能拿失业保险吗"
    - "我干了三年零一个月"
    - "那到底能赔我多少钱"
  probes:
    - turn: 8
      expects: ["月工资：12000"]
    - turn: 14
      expects: ["城市：西安"]
    - turn: 20
      expects: ["工作年限（月）：37"]

