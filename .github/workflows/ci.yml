# F34：CI + Recall 回归门禁。
#
# ## 这个文件要回答的问题
#
# 面试官会问「你怎么防止改坏」。答案有两半，缺一半都不成立：
#
#   1. **单测**：改完之后系统还跑不跑得通。
#      跑不通是立刻知道的（红了），所以这一半大家都会做。
#   2. **门禁**：改完之后**质量有没有掉**。
#      这个不会红——Recall 从 0.90 掉到 0.85，所有测试照样全绿，
#      代码也照样跑得好好的。**只有拿数字跟上一版比才知道。**
#
# 所以下面有两个 job：`test` 管第一半，`recall-gate` 管第二半。
#
# ## 为什么门禁 job 只跑一半的检查（这一点必须说清楚）
#
# `configs/recall_gate.yaml` 里有三条门禁，但 CI 里只有第一条会真的跑：
#
#   - `bm25-test`      ← 只要 numpy，**CI 必跑**
#   - `dense-test`     ← 要 sentence-transformers，**CI 里 SKIP**
#   - `prod-arm-test`  ← 要 ml extra（含 torch ≈ 2.5GB），**CI 里 SKIP**
#
# 不装 ml extra 是因为：一次 CI 要下载 2.5GB 的 CUDA torch 加一个 bge 模型，
# 跑十几分钟——**而"慢到没人愿意等"的 CI 会被关掉**，那才是真的什么都没守住。
#
# 但要紧的是**别把 SKIP 说成 PASS**：
# `check_recall.py` 会在汇总里单独打一行"⚠️ 跳过的（没跑 ≠ 通过）"，
# 所以 CI 日志里看得见少跑了什么。想跑全的用 `workflow_dispatch` 手动触发
# （下面 `recall-gate-full` 那个 job），或者在本机 `uv sync --extra ml` 之后跑。
#
# ## 怎么验证"门禁真的会红"
#
# F34 的验收标准里有一句：**故意让 Recall 掉下去，CI 变红。**
# 验法（很土但很直接）：把 `configs/recall_gate.yaml` 里 `bm25-test` 的
# `recall_art@5` 下限改成 `0.99`，开个 PR，看 `recall-gate` 这个 job 变红。
# 验完记得改回来。
#
# 单纯让代码"看起来更差"是没用的——**门禁的难点不在门禁本身，
# 在于它得真的连着一次真实的测量**。这也是为什么它调的是
# `scripts/check_recall.py` 而不是直接读 `reports/ablation.json`：
# 后者是提交进仓库的快照，可能过期几个月，拿它做门禁等于拿一张旧体检报告当今天的诊断。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "连 ml 组门禁一起跑（要下载 torch 和 bge 模型，很慢）"
        type: boolean
        default: false

# 同一个分支连续推两次时，把上一次没跑完的取消掉。
# 不做这个的话，连推五个 commit 会同时跑五份 CI，互相抢跑还浪费时间。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # 第一半：系统还跑不跑得通
  # ------------------------------------------------------------------ #
  test:
    name: 单测（免 key、免 GPU）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          # ⚠️ 钉住 3.12，和 pyproject 的 `requires-python` 保持一致。
          # 不钉的话 CI 会去挑 runner 上最新的解释器，而 torch 的
          # cu124 wheel 还没有 cp314 版本——那个报错发生在依赖解析之后、
          # 装包之前，信息很绕，第一次遇到很容易以为是网络问题。
          python-version: "3.12"

      - name: 装依赖（不含 ml extra）
        # **只装 dev，不装 ml**：整套单测用的是假件（`tests/fakes.py`），
        # 不需要模型、不需要 API key。需要 faiss 的那一条会自己跳过。
        run: uv sync --extra dev

      - name: 跑单测
        # `not network` 排掉需要真实 key / 联网下载模型的测试。
        # 剩下的全部离线可跑，包括 LLM 层——它走的是 `replay` 模式，
        # 读的是提交进仓库的 fixtures。
        run: uv run pytest -m "not network"

      - name: 前端 Markdown 渲染自检
        # **这个能进 CI，而 `check_ui.mjs` 不能**，区别就一条：
        # 它只要 node 和仓库里已有的文件（fixtures 是提交进仓库的），
        # 不需要起服务、不需要 key、不需要网络，跑一遍一秒钟。
        #
        # 它拿**真实录制的模型答案**喂渲染器，回答的是一个 pytest
        # 天然测不到的问题：**模型真写出来的那些格式，页面认不认。**
        # 单测只能测到我手写的样例，而"表格"这种构造，
        # 不去数真实数据根本想不到要做——这个文件就是为它写的。
        #
        # 跑在前端那个文件（web/index.html）的**当前内容**上，
        # 所以它同时也是一道"谁改了渲染器、改坏了没有"的门禁。
        run: node tests/ui/check_markdown.mjs

  # ------------------------------------------------------------------ #
  # 第二半：质量有没有掉
  # ------------------------------------------------------------------ #
  recall-gate:
    name: Recall 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 装依赖（不含 ml extra）
        run: uv sync --extra dev

      - name: 跑门禁
        # ⚠️ **这一步红了是好事**：它要么是数据层真的退化了，
        # 要么是语料/评测集换过、基线该重新标定（那会退出码 3）。
        # 两种情况的处置完全不同，所以脚本用了不同的退出码，
        # 不清不楚地都报"失败"会让人查错方向。
        #
        # 退出码：0 全过 / 1 有指标掉了 / 2 环境不齐 / 3 基线过期
        run: uv run python scripts/check_recall.py

  # ------------------------------------------------------------------ #
  # 同一条门禁，但要 ml extra。**只在手动触发或 full=true 时跑。**
  # ------------------------------------------------------------------ #
  recall-gate-full:
    name: Recall 门禁（含 ml 组）
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.full
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 装依赖（含 ml extra）
        # 这一步会下载 torch（CPU 版，因为上面的 explicit index 只在
        # 本地配了 cu124，CI 上会回落到 PyPI 的 CPU wheel）+ bge 模型。
        # 慢，所以只在需要的时候跑。
        run: uv sync --extra dev --extra ml

      - name: 跑全部门禁
        # 连 `dense-test` 和 `prod-arm-test` 一起跑，这次**不会有 SKIP**。
        run: uv run python scripts/check_recall.py
