[project]
name = "juris-agent"
version = "0.1.0"
description = "可溯源劳动法咨询 Agent：从 RAG 到 Agent 的可靠性工程与评测体系"
readme = "README.md"
# 上界卡在 <3.14 是**踩过坑之后加的**，不是随手写的：
# uv 在没有 `.python-version` 时会挑机器上最新的解释器（本机是 3.14.8），
# 于是 `uv sync --extra ml` 里那条 `torch==2.6.0+cu124` 直接装不上——
#    error: Distribution torch==2.6.0+cu124 ... doesn't have a source distribution
#           or wheel for the current platform
#    hint:  You're using CPython 3.14 (cp314), but torch has wheels with ABI tags
#           cp312, cp313, cp313t
# 这个错发生在**依赖解析之后、装包之前**，报错信息绕，第一次很容易以为是网络问题。
# 真正的约束是「PyTorch 的 cu124 wheel 还没出 cp314 版本」，与我们的代码无关。
# 钉在 3.12：wheel 最全，也是 torch 生态最稳的版本。
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # ⚠️ **这里原本还有 `sse-starlette`，装完就没用过，已删除。**
    # 一开始想着"SSE 就该用专门的库"，实际写的时候发现直接
    # `StreamingResponse` + 手写 `event: xxx\ndata: {...}\n\n` 就够了：
    # 事件的形状由我们自己定（见 `api/events.py`），而 sse-starlette 提供的
    # 额外东西（自动心跳、ping 事件、内置的断连检测）这里都不需要——
    # 断连检测我用的是 `request.is_disconnected()`，一条 if 的事。
    # **一个声明了却没人 import 的依赖，是"你以为在用、其实没在用"的隐患**：
    # 面试时被问"为什么选 sse-starlette"，答案只能是"我不记得了"。
    "langgraph>=1.2.15",
]

[project.optional-dependencies]
# 检索与重排的 GPU 栈。单独成组是刻意的：工具层（domain + executor）与它的测试
# 只需要 pydantic，不该为了跑一次单元测试下载 2.5GB 的 CUDA torch。
# 需要检索时：uv sync --extra ml
# ⚠️ 原计划（need.md F3）这里写的是 chromadb，**实测后被我拿掉了**，理由留档：
#
#   语料是 1730 条、向量 768 维 → 整个索引 1730×768×4B ≈ 5.3 MB。
#   在这个规模下暴力点积（numpy 的 `mat @ q`）是**微秒级**的，比任何向量库的
#   查询开销都低，而且是**精确**检索——向量库在这个规模上唯一的卖点是近似加速，
#   而近似只会让 Recall 变差。
#
#   代价却是实打实的：chromadb 会拖进 kubernetes / onnxruntime / grpcio /
#   opentelemetry，装完 300MB+ 依赖、冷启动拉起一个持久化客户端，**换来的指标
#   一分不涨**。面试里被问「为什么用向量库」，答不出「因为数据量大」就是硬伤。
#
#   所以：核心用 numpy 暴力检索（`retrieval/dense.py` 的 `NumpyIndex`）；
#   `faiss-cpu` 保留成**可选后端**，专门给 F24 做「精确 vs IVF 近似」的对照臂——
#   这条轴比「Chroma vs FAISS」有意义，因为后者两者的 Recall 必然完全相同
#   （都是精确检索），差别只在 QPS，而那属于压测（F32）不属于消融（F24）。
ml = [
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "torch>=2.5",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "matplotlib>=3.9",
]

[tool.uv]
# torch 装 CUDA 版（cu124）：本机 RTX 4060，默认 PyPI 上是 CPU-only
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juris_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: 需要真实 API key 或联网下载模型的测试（CI 里用 -m 'not network' 跳过）",
]
addopts = "-q"
# HTTP 层的测试是 async 的（接口和测试客户端都是异步的），需要这一行才能跑。
#
# 为什么用 `auto` 而不是给每个测试挂 `@pytest.mark.asyncio`：
# 挂标记的写法下，**忘挂的那个测试不会失败，它会被静默跳过**——
# pytest-asyncio 的 strict 模式对未标记的 async 函数是"不认它"，
# 于是它既不算通过也不算失败，只是不出现在结果里。
# 一个"写完了但一直没跑"的测试比没有测试更坏：它让人以为那部分被盖住了。
# `auto` 让"写了就一定跑"。代价是少了一层"这个测试确实是异步的"的显式声明，
# 而那层声明在这个项目里没有任何实际作用。
asyncio_mode = "auto"
