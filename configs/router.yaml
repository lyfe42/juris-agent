# 路由规则表 —— Agent 判断"用户这句话该走哪条路"的依据。
#
# ## 为什么规则写在配置文件里，而不是硬编码进 router.py
#
# 因为路由规则会**被真实 badcase 持续修改**。线上跑一段时间，一定会遇到
# "这句话明明问的是加班费，却被判成了越界" 这类问题。那时的修法是
# "加一个词、重跑评测集、看误判率降没降"，而不是"改代码、提交、发版"。
# 把词表从代码里挪出来，改词表和改代码的成本差一个数量级。
#
# ## 为什么不用让大模型来判断该走哪条路（这一步不用 LLM）
#
# 三个理由，一个比一个硬：
#   1. **路由错了整条链路就白跑**，这是最不该押在"模型这次恰好评对了"上的地方；
#   2. 规则路由**免费、零延迟（微秒级）、100% 可复现**，而 LLM 路由要几百毫秒和钱；
#   3. 规则路由的**错误是可解释的**——"因为这句话里有『离婚』且没有任何劳动法词，
#      所以判成越界"，这句话能写进日志、能被用户纠正。LLM 路由只能给你一个标签。
#
# ⚠️ 但它不是万能的：**指代和反讽它接不住**（"那我要是不签呢？"里没有任何关键词）。
#    那种情况靠对话历史补全（见 `router.py` 的 `_with_history`），而不是靠加词表。
#
# ## 判定的顺序（很重要，改词表前先读这一段）
#
#   1. 先看有没有**劳动法信号**（`in_scope_signals`）→ 有就直接算在范围内。
#      这一步必须在越界判定**之前**：因为"我离婚了，公司辞退我该赔多少"里
#      同时有「离婚」和「赔偿」，先判越界就会把一道劳动法题扔掉。
#   2. 没有劳动法信号，再看有没有**越界信号**（`out_of_scope_signals`）→ 越界。
#   3. 都没有，看是不是**闲聊**（`chitchat_signals`，且句子够短）→ 闲聊。
#   4. 再没有，看是不是**计算题**（`calc_signals`）→ 计算题。
#   5. 兜底 → 法条问答。
#
# 换句话说：**劳动法是"主"，其他都是"客"**。客随主便。

version: 1

# 出现任一即认为是"用户真的要问劳动法"。这些词是**领域名词**，不是日常词——
# 用「工资」而不是「钱」，因为"我这钱该找谁要"里的「钱」不构成劳动法信号。
in_scope_signals:
  - 劳动合同
  - 劳动法
  - 劳动关系
  - 用人单位
  - 劳动者
  - 员工
  - 职工
  - 公司辞退
  - 被辞退
  - 辞退
  - 开除
  - 裁员
  - 离职
  - 辞职
  - 解除合同
  - 解除劳动合同
  - 经济补偿
  - 经济补偿金
  - 赔偿金
  - 补偿金
  - 加班
  - 加班费
  - 试用期
  - 转正
  - 竞业限制
  - 竞业
  - 保密协议
  - 服务期
  - 违约金
  - 工资
  - 月薪
  - 底薪
  - 绩效
  - 社保
  - 五险一金
  - 社会保险
  - 公积金
  - 工伤保险
  - 失业保险
  - 生育津贴
  - 劳动仲裁
  - 仲裁
  - 工伤
  - 劳动合同法
  - 劳动法
  - 年休假
  - 产假
  - 陪产假
  - 病假
  - 医疗期
  - 不定时工作制
  - 劳务派遣
  - 非全日制
  - 拖欠工资
  - 欠薪
  - 二倍工资
  - 双倍工资
  - 离职证明
  - 竞业协议
  - 工龄
  - 工作年限
  - 劳动关系存续
  - 用人单位

# 出现任一即认为是"别的法律领域"或"不是法律问题"。
# ⚠️ 这些词**只在没有劳动法信号时**才生效，所以可以放心写得宽一点。
out_of_scope_signals:
  # —— 其他法律领域 ——
  - 离婚
  - 结婚
  - 婚姻
  - 彩礼
  - 抚养权
  - 遗产
  - 继承
  - 遗嘱
  - 房产证
  - 买房
  - 房东
  - 租赁合同
  - 交通事故
  - 醉驾
  - 刑事
  - 判刑
  - 坐牢
  - 取保候审
  - 诈骗
  - 盗窃
  - 拘留
  - 起诉离婚
  - 股权
  - 股东
  - 商标
  - 专利
  - 著作权
  - 知识产权
  - 侵权
  - 借贷
  - 欠条
  - 民间借贷
  - 消费者权益
  - 医疗事故
  - 移民
  - 签证
  - 报税
  - 个税
  - 个人所得税
  # —— 不是法律问题 ——
  - 天气
  - 股票
  - 基金
  - 彩票
  - 游戏
  - 翻译
  - 写代码
  - 编程
  - 数学题
  - 你是谁
  - 讲个笑话

# 闲聊。**只有句子很短、且没有法律信号时才判闲聊**——
# 否则"你好，我想问下加班费"会被判成闲聊，用户会觉得系统在装傻。
chitchat_signals:
  - 你好
  - 您好
  - 在吗
  - 在不在
  - 早上好
  - 中午好
  - 晚上好
  - 谢谢
  - 感谢
  - 再见
  - 拜拜
  - 辛苦了
  - 你是机器人吗
  - 你能做什么
  - 你会什么
  - 怎么用
  - 使用说明

# 计算题信号。命中说明用户不只想知道"法律怎么规定"，还想知道"我到底能拿多少/还来得及吗"。
# ⚠️ 这些词是**和 `calc_tools` 的键对应的**——加了新计算器就要在这里加对应词，
#    否则那个工具永远轮不到（这是 `tests/test_router.py` 里唯一真正需要维护的断言）。
calc_signals:
  计算:
    - 多少钱
    - 多少
    - 能拿
    - 能赔
    - 能要
    - 怎么算
    - 如何算
    - 怎么计算
    - 算一下
    - 算算
    - 帮我算
    - 计算
    - 应得
    - 赔付
    # ⚠️ 这里**故意不写单独的「算」**。「我打算辞职」里也有「算」，
    # 加了它会把一大批不相干的句子拉进计算路。宁可漏"你算算"这种口语，
    # 也不要让「打算」这种高频词误触发——**误触发的代价是每次多花一次模型调用**，
    # 而漏掉的代价只是走 law 路（`search_law` 照样能答）。
  试用期:
    - 试用期
    - 试用
  时效:
    - 时效
    - 过期
    - 还来得及
    - 多久之内
    - 仲裁期限
    - 追溯期
  加班:
    - 加班费
    - 加班工资
    - 加班

# 「组合信号」——**必须每组都命中**才算。
#
# 为什么需要它：合同体检的问法太多了（"帮我看看这份合同有没有问题"、
# "这份合同合不合法"、"帮我审查下合同"），想用几个固定短语全覆盖是不现实的。
# 但只用「合同」两个字又太宽——"房东的租赁合同有问题"也会中。
#
# 所以拆成两组：**必须同时提到"合同"和"疑问词"**。
# 这样 "帮我看看这份合同有没有问题" 中（有「合同」+ 有「问题」），
# 而 "租赁合同押金不退" 不中（没有疑问词）。
#
# ⚠️ 组合信号**只在没有劳动法信号时才会被用到**（见 `router.py` 的判定顺序），
# 所以不用担心它把 "劳动合同签了但公司不给钱" 这种句子抢走。
calc_all_of:
  合同体检:
    - ["合同"]
    - ["问题", "合法", "条款", "体检", "审查", "合规", "看", "帮我看", "检查"]

# 计算题的**优先级顺序**：一句话里同时出现「试用期」和「多少钱」时，
# 靠这个顺序定谁先。写在前面的优先。
# 理由：越具体的信号越可信。「试用期」是名词，只可能在问试用期；
# 「多少钱」是通用词，一句话里到处都是。
calc_priority:
  - 试用期
  - 合同体检
  - 时效
  - 加班
  - 计算

# 闲聊判定要求句子不超过这么多字。**这个阈值存在的理由是防误判**：
# "你好，我想咨询一个关于竞业限制的问题" 有 18 个字，不该走闲聊。
chitchat_max_chars: 12

# 计算题判定要求句子至少有这么多字，防止 "多少" 两个字就被当成计算题。
calc_min_chars: 4
