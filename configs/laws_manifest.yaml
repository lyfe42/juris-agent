# 法规清单 —— 生效日期的**唯一权威来源**。
#
# 为什么要有这份文件（而不是让 ingest 从正文里正则抓日期）：
#
#   带修正的法律，附则里至今**保留着原始施行条款**。劳动合同法第九十八条现在
#   仍然写着"本法自2008年1月1日起施行"——但那是 2007 版。你手上这份是 2012 修正版，
#   它的生效日是修正决定的施行日（2013-07-01）。正则抓到的是前者，是错的。
#
#   同理，文件名里的日期是**公布日**，不是施行日。司法解释（二）文件名 `_20250731`，
#   而正文写着"自2025年9月1日起施行"。
#
# 所以规则是：
#   - `effective_date` 以本文件为准，ingest 直接采用；
#   - 本文件没写的，才回退到正文正则，并在记录里标 `effective_date_source: text-regex`；
#   - 每条都带 `verified`。**false = 初值，尚未人工核对。**
#     核对方式：打开 data/raw/ 下对应文件，看开头的括号（通过/修正日期）
#     和末条的施行条款，两者结合判断。核对完把依据写进 `note`。
#
#   ⚠️ 2026-10-15：8 条已由项目作者确认为现行有效版本，`verified` 全部置 true。
#      这表示"数据来源没问题"，**不等于每条生效日期都逐字复核过**——
#      带修正的法律请仍按上面的方式抽查一遍（第 5~7 行的陷阱仍然成立）。
#
# 已经能从正文自述拿到日期的（末尾"本法自××××年××月××日起施行"），
# note 里标了"正文自述"——但也只算旁证，仍以人工核对为准。

version: 1

