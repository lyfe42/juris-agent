# 口语 → 法条用语 映射表（F9 查询改写的**廉价路径**）。
#
# 收录标准只有一条：**这一条在实测里真的造成过召回失败**（gold 完全没被召回），
# 或者是在 21 条人工 gold 上肉眼可见的高频鸿沟。不收录"意思相近但没造成过失败"
# 的词——每个词都是往 BM25 里加的一份噪声，加错了会把原本能召回的题挤下去。
#
# 需要复核来源时，`grep -c "术语" data/laws.jsonl` 能确认术语确实在语料里出现。
# （本表所有右值都已核对过出现在语料中；"不收费"只在《劳动争议调解仲裁法》
#   第五十三条出现 1 次，这正是 g009 那条题失败的原因——语料里有，但对不上。）

version: "1"

map:
  # —— 实测失败过的三条（F23 基线里的 g010 / g009 / g007）——
  辞职:
    - 解除劳动合同
  交钱:
    - 收费
    - 费用
  加班:
    - 延长工作时间

  # —— 同族的口语说法，同一类鸿沟 ——
  离职:
    - 解除劳动合同
  不干了:
    - 解除劳动合同
  被开除:
    - 解除劳动合同
  被辞退:
    - 解除劳动合同
  开除:
    - 解除劳动合同

  # —— 主体/客体称谓 ——
  老板:
    - 用人单位
  公司:
    - 用人单位
  员工:
    - 劳动者
  薪水:
    - 劳动报酬
    - 工资
  月薪:
    - 工资
  欠薪:
    - 拖欠劳动报酬
  拖欠工资:
    - 拖欠劳动报酬

  # —— 社保 ——
  五险一金:
    - 社会保险费
    - 社会保险
  不交社保:
    - 未依法缴纳社会保险费
  交社保:
    - 缴纳社会保险费

  # —— 合同 ——
  签合同:
    - 订立书面劳动合同
  书面合同:
    - 书面劳动合同
  竞业禁止:
    - 竞业限制
  押金:
    - 担保
    - 财物

  # —— 赔偿口径（这几个词在法条里是**互不相同**的法律概念，不能互换，
  #    所以映射成并列变体而不是替换——由检索去分辨哪一个对）——
  赔偿:
    - 赔偿金
    - 经济补偿
  补偿:
    - 经济补偿
  违约金:
    - 违约金
