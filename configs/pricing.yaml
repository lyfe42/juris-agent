# 模型牌价。**会变的数字不进代码**——所以单价全在这张表里，代码只读它。
#
# ⚠️ 三条必须说清楚的：
#
# 1. **这张表是手抄的，不是自动抓的。** 报价一变，按它算出来的钱就全错。
#    所以每个数字都带 `as_of`；报表里所有金额都注明"按本表牌价换算"。
# 2. **它是估算，不是账单。** 我们算的是"把这段 prompt 发过去要花多少"，
#    不含重试、不含失败调用、不含 prompt 缓存命中与否的差别。
#    真实的账单要去看控制台。**把估算当账单报，是面试里的硬伤。**
# 3. 换模型/换供应商时**先改这里**，不要改代码。
#
# 单位：每百万 token。
currency: CNY
unit: per_million_tokens
as_of: "2026-10"

models:
  deepseek-flash:
    input: 2.0
    output: 8.0
    note: >-
      生成模型。⚠️ **它是推理模型，思考过程也算 output 计费**——
      实测 max_tokens=32 时 content 会是空字符串，因为额度全被思考吃掉了。
      所以"输出很便宜"这个直觉在这里不成立。
  deepseek-v4-pro:
    input: 4.0
    output: 16.0
    note: 裁判模型（F26）。只在离线评测里用，不进在线路径。

# prompt 缓存命中时的折算系数。各家口径差别很大（有的只折输入、有的完全不折），
# 这里取一个常见的量级。**它只影响成本报表，不影响任何指标。**
cache:
  hit_discount: 0.1
